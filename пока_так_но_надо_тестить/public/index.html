<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система распределения студентов - Публичный доступ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Система распределения студентов в общежитиях</h1>
            <nav>
                <a href="/admin">Вход для администратора</a>
            </nav>
        </header>

        <main>
            <section class="search-section">
                <h2>Поиск студентов</h2>
                <div class="search-form">
                    <input type="text" id="searchInput" placeholder="Введите ФИО студента...">
                    <button onclick="searchStudents()">Найти</button>
                    <button onclick="clearSearch()">Показать всех</button>
                </div>
            </section>

            <section class="filter-section">
                <h3>Отображать:</h3>
                <div class="filter-control">
                    <select id="studentFilter" class="filter-select">
                        <option value="all">Все студенты</option>
                        <option value="accommodated">Только заселенные</option>
                        <option value="waiting">Только в очереди</option>
                    </select>
                </div>
            </section>

            <section class="students-section">
                <h2>Список студентов</h2>
                <div id="studentsList" class="students-list">
                    <!-- Список студентов будет загружен здесь -->
                </div>
            </section>
        </main>
    </div>

    <div> <footer> Боёк Елена, Степук Иван Т-395</footer></div>
   

    <script src="js/main.js"></script>
</body>
</html>
