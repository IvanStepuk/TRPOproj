<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студент - Система распределения</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Система распределения студентов в общежития</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()">Выйти</button>
            </div>
        </header>
        
        <nav>
            <ul>
                <li><a href="#" onclick="showSection('application')">Моя заявка</a></li>
                <li><a href="#" onclick="showSection('queue')">Мое место в очереди</a></li>
                <li><a href="#" onclick="showSection('dormitories')">Информация об общежитиях</a></li>
            </ul>
        </nav>
        
        <main>
            <div id="applicationSection" class="section">
                <h2>Моя заявка на размещение</h2>
                <div id="applicationInfo"></div>
                <div id="applicationFormContainer" style="display: none;">
                    <form id="applicationForm">
                        <div class="form-group">
                            <label for="dormitoryType">Тип общежития:</label>
                            <select id="dormitoryType" name="dormitory_type" required>
                                <option value="single">Несемейное</option>
                                <option value="family">Семейное</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="familyIncome">Средний доход на члена семьи (руб.):</label>
                            <input type="number" id="familyIncome" name="family_income" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="averageGrade">Средний балл успеваемости:</label>
                            <input type="number" id="averageGrade" name="average_grade" min="0" max="5" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="socialActivity">Общественная нагрузка:</label>
                            <input type="checkbox" id="socialActivity" name="social_activity">
                        </div>
                        <button type="submit">Подать заявку</button>
                    </form>
                </div>
                <div id="applicationActions" style="display: none;">
                    <button onclick="editApplication()">Редактировать заявку</button>
                    <button onclick="cancelApplication()">Отменить заявку</button>
                </div>
            </div>
            
            <div id="queueSection" class="section" style="display: none;">
                <h2>Мое место в очереди</h2>
                <div id="queueInfo"></div>
            </div>
            
            <div id="dormitoriesSection" class="section" style="display: none;">
                <h2>Информация об общежитиях</h2>
                <div id="dormitoriesInfo"></div>
            </div>
            
            <div id="message" class="message"></div>
        </main>
        
        <footer>
            <p></p>
        </footer>
    </div>
    
    <script src="js/student.js"></script>
</body>
</html>
